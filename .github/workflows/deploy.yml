name: Check & Deploy Courier Hub

on:
  push:
    branches: [main, dev]
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false # never cut a deploy off half-way

jobs:
  # ── 1. Catch broken code before it reaches the server ──
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend - install and import check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci # only imported, never connected
        run: |
          pip install -r requirements.txt
          python -m compileall -q app alembic
          python -c "import app.main; print('backend imports OK')"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - install, type check and lint
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

  # ── 2. Deploy: main → /opt/courierhub (production), dev → /opt/courierhub-dev ──
  # Runs on the same server as ParentVox, on its own folders, ports, services and database.
  deploy:
    needs: check
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/opt/courierhub"         >> $GITHUB_OUTPUT
            echo "name=courierhub"             >> $GITHUB_OUTPUT
            echo "port=8200"                   >> $GITHUB_OUTPUT
          else
            echo "dir=/opt/courierhub-dev"     >> $GITHUB_OUTPUT
            echo "name=courierhub-dev"         >> $GITHUB_OUTPUT
            echo "port=8201"                   >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ steps.env.outputs.dir }}

            # Exactly what is on GitHub (server-only files like .env are untracked and kept).
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Backend: dependencies + database migrations
            source venv/bin/activate
            pip install -q -r backend/requirements.txt
            cd backend
            alembic upgrade head
            cd ..

            # Website: build with the server's frontend/.env.production.local (BACKEND_URL is read at build time)
            cd frontend
            npm ci --no-audit --no-fund
            npm run build
            chown -R www-data:www-data .next # next start writes its cache here
            cd ..

            systemctl restart ${{ steps.env.outputs.name }}-api ${{ steps.env.outputs.name }}-web ${{ steps.env.outputs.name }}-tracking

            # Fail the deploy if the API does not come back up.
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:${{ steps.env.outputs.port }}/health > /dev/null; then
                echo "Deployed ${{ github.ref_name }} → ${{ steps.env.outputs.dir }} ($(git rev-parse --short HEAD))"
                exit 0
              fi
              sleep 3
            done
            echo "API did not become healthy - check: journalctl -u ${{ steps.env.outputs.name }}-api -n 100"
            exit 1
